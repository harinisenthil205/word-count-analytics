<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WordWise Analytics{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">W</span> WordWise <span class="brand-light">Analytics</span></a>
        <nav>
            <a href="{{ url_for('index') }}">Analyzer</a>
            <a href="{{ url_for('about') }}">About Word Count</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>WordWise Analytics · Big Data Analytics Mini Project</p>
        <p>Built with Python, Flask, HTML and CSS</p>
    </footer>
</body>
</html>
